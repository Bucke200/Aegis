[project]
name = "aegis-threat-monitor"
version = "1.0.0"
description = "VIP Threat Monitoring Platform for Social Media"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Aegis Security Team" }]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pika==1.3.2",
    "elasticsearch==8.11.0",
    "redis==5.0.1",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "tweepy==4.14.0",
    "aiohttp==3.12.15",
    "async-lru==2.0.5",
    "python-dotenv==1.0.0",
    "click==8.2.1",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==25.1.0",
    "flake8==7.3.0",
    "mypy==1.7.1",
]
nlp = [
    "transformers==4.36.0",
    "torch==2.8.0",
    "spacy==3.7.2",
    "imagehash==4.3.1",
    "pillow==10.1.0",
    "networkx==3.2.1",
    "opencv-python==4.8.1.78",
]
scraping = [
    "scrapy==2.11.0",
    "selenium==4.15.2",
]
messaging = [
    "python-telegram-bot==20.7",
    "celery==5.3.4",
]
auth = [
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
]
utilities = [
    "httpx==0.25.2",
    "aiofiles==23.2.1",
]
monitoring = [
    "prometheus-client==0.19.0",
]

[tool.uv]
package = false
