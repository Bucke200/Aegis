[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.1.0"
description = "Aegis VIP threat and misinformation monitoring platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Aegis Security Team" }]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3.6,<1",
    "aio-pika>=9.5,<10",
    "minio>=7.2,<8",
    "structlog>=24.4,<26",
    "prometheus-client>=0.21,<1",
    "tenacity>=9.0,<10",
    "pybreaker>=1.2,<2",
    "httpx>=0.28,<1",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "pyahocorasick>=2.1,<3",
    "datasketch>=1.6,<2",
    "networkx>=3.4,<4",
    "lingua-language-detector>=2.1,<3",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
]

[project.scripts]
aegis-api = "aegis.api.main:main"
aegis-normalizer = "aegis.pipeline.normalizer:main"
aegis-worker = "aegis.pipeline.analysis:main"
aegis-media-worker = "aegis.pipeline.media:main"
aegis-capture = "aegis.evidence.capture:main"
aegis-admin = "aegis.api.admin:main"
aegis-eval = "aegis.eval.__main__:main"

[dependency-groups]
collectors = [
    "telethon>=1.40,<2",
]
analysis = [
    "torch>=2.5,<3",
    "transformers>=4.47,<5",
    "scikit-learn>=1.6,<2",
    "confusable-homoglyphs>=3.3,<4",
]
media = [
    "clamd>=1.0,<2",
    "imagehash>=4.3,<5",
    "open-clip-torch>=2.29,<3",
    "paddleocr>=2.9,<3",
    "sentence-transformers>=3.3,<7",
]
capture = [
    "playwright>=1.49,<2",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "coverage>=7.6,<8",
    "respx>=0.22,<1",
    "pytest-timeout>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations/versions", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "aegis.api.dependencies.require_role",
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
timeout = 120
addopts = "-q"

[tool.uv]
package = true
