name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.27"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy aegis
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis123
          POSTGRES_DB: aegis_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: aegis
          RABBITMQ_DEFAULT_PASS: aegis123
        ports:
          - "5672:5672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis:aegis123@localhost:5432/aegis_test
      AEGIS_TEST_RABBITMQ_URL: amqp://aegis:aegis123@localhost:5672/
      AEGIS_TEST_MINIO_ENDPOINT: localhost:9000
      AEGIS_TEST_MINIO_ACCESS_KEY: aegis-app
      AEGIS_TEST_MINIO_SECRET_KEY: aegis-app-secret
      AEGIS_TEST_MINIO_RETENTION_ACCESS_KEY: aegis-retention
      AEGIS_TEST_MINIO_RETENTION_SECRET_KEY: aegis-retention-secret
      AEGIS_TEST_MINIO_EVIDENCE_BUCKET: aegis-evidence
      AEGIS_TEST_MINIO_MEDIA_BUCKET: aegis-media
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Start MinIO
        run: |
          if ! run_output=$(docker run -d --name minio -p 9000:9000 -p 9001:9001 \
              -e MINIO_ROOT_USER=aegis -e MINIO_ROOT_PASSWORD=aegis123 \
              bitnamilegacy/minio:latest 2>&1); then
            echo "::error::minio container start failed: $run_output"
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::minio did not become healthy"
          docker logs minio || true
          exit 1
      - name: Provision MinIO buckets, users, and policies
        run: |
          if ! provision_output=$(docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              -v "${{ github.workspace }}/deploy/minio:/policies:ro" \
              --entrypoint /bin/sh \
              -e MC_HOST_local="http://aegis:aegis123@host.docker.internal:9000" \
              bitnamilegacy/minio:latest -c '
                set -e
                mc mb --ignore-existing --with-lock local/aegis-evidence
                mc mb --ignore-existing local/aegis-media
                mc version enable local/aegis-evidence
                mc version enable local/aegis-media
                mc admin user add local aegis-app aegis-app-secret
                mc admin user add local aegis-retention aegis-retention-secret
                mc admin policy create local aegis-app /policies/app-policy.json
                mc admin policy create local aegis-retention /policies/retention-policy.json
                mc admin policy attach local aegis-app --user aegis-app
                mc admin policy attach local aegis-retention --user aegis-retention
              ' 2>&1); then
            echo "::error::minio provisioning failed: $provision_output"
            exit 1
          fi
      - name: Run tests
        run: |
          set +e
          uv run pytest -q --tb=short > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR)" pytest-output.txt | head -n 20 | tr '\n' ' ')
            echo "::error::pytest failed: $summary"
          fi
          exit "$status"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: pip-audit
        run: uv run --with pip-audit pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis123
          POSTGRES_DB: aegis_e2e
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: aegis
          RABBITMQ_DEFAULT_PASS: aegis123
        ports:
          - "5672:5672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis123@localhost:5432/aegis_e2e
      AEGIS_RABBITMQ_URL: amqp://aegis:aegis123@localhost:5672/
      AEGIS_JWT_SECRET: e2e-jwt-secret-not-production
      AEGIS_FINGERPRINT_SALT: e2e-fingerprint-salt
      AEGIS_TOXICITY_ENABLED: "false"
      AEGIS_CORS_ORIGINS: http://localhost:4173
      VITE_API_URL: http://localhost:8000
      E2E_API_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrate and seed
        run: |
          uv run alembic upgrade head
          uv run python frontend/e2e/seed.py
      - name: Start API and workers
        run: |
          uv run aegis-normalizer > normalizer.log 2>&1 &
          sleep 3
          uv run aegis-api > api.log 2>&1 &
          uv run aegis-worker > worker.log 2>&1 &
          uv run python -m aegis.pipeline.outbox_publisher > outbox.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy"
          cat api.log || true
          exit 1
      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Dump service logs on failure
        if: failure()
        run: tail -n 100 api.log normalizer.log worker.log outbox.log || true
