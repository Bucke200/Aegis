name: aegis

x-app-environment: &app-environment
  AEGIS_ENVIRONMENT: ${AEGIS_ENVIRONMENT:-development}
  AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
  AEGIS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis123}@postgres:5432/${POSTGRES_DB:-aegis}
  AEGIS_RABBITMQ_URL: amqp://${RABBITMQ_USER:-aegis}:${RABBITMQ_PASSWORD:-aegis123}@rabbitmq:5672/
  AEGIS_MINIO_ENDPOINT: minio:9000
  AEGIS_MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-aegis-app}
  AEGIS_MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-aegis-app-secret}
  AEGIS_MINIO_RETENTION_ACCESS_KEY: ${MINIO_RETENTION_ACCESS_KEY:-aegis-retention}
  AEGIS_MINIO_RETENTION_SECRET_KEY: ${MINIO_RETENTION_SECRET_KEY:-aegis-retention-secret}
  AEGIS_MINIO_SECURE: "false"
  AEGIS_CLAMAV_HOST: clamav
  AEGIS_CLAMAV_PORT: "3310"

x-app-base: &app-base
  env_file:
    - path: .env
      required: false
  environment:
    <<: *app-environment
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: aegis_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aegis}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aegis123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:latest
    container_name: aegis_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aegis123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: bitnamilegacy/minio:latest
    container_name: aegis_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aegis123}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-aegis-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-aegis-app-secret}
      MINIO_RETENTION_ACCESS_KEY: ${MINIO_RETENTION_ACCESS_KEY:-aegis-retention}
      MINIO_RETENTION_SECRET_KEY: ${MINIO_RETENTION_SECRET_KEY:-aegis-retention-secret}
    volumes:
      - ./deploy/minio:/policies:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing --with-lock local/aegis-evidence &&
        mc mb --ignore-existing local/aegis-media &&
        mc version enable local/aegis-evidence &&
        mc version enable local/aegis-media &&
        (mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" || true) &&
        (mc admin user add local "$$MINIO_RETENTION_ACCESS_KEY" "$$MINIO_RETENTION_SECRET_KEY" || true) &&
        (mc admin policy create local aegis-app /policies/app-policy.json || true) &&
        (mc admin policy create local aegis-retention /policies/retention-policy.json || true) &&
        mc admin policy attach local aegis-app --user "$$MINIO_APP_ACCESS_KEY" &&
        mc admin policy attach local aegis-retention --user "$$MINIO_RETENTION_ACCESS_KEY"
    restart: "no"

  api:
    <<: *app-base
    build:
      context: .
      target: api
    image: aegis-api
    container_name: aegis_api
    command: ["aegis-api"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *app-base
    build:
      context: .
      target: analysis
    image: aegis-analysis
    container_name: aegis_worker
    command: ["aegis-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  normalizer:
    <<: *app-base
    build:
      context: .
      target: analysis
    image: aegis-analysis
    container_name: aegis_normalizer
    command: ["aegis-normalizer"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  outbox:
    <<: *app-base
    build:
      context: .
      target: analysis
    image: aegis-analysis
    container_name: aegis_outbox
    command: ["python", "-m", "aegis.pipeline.outbox_publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    image: aegis-frontend
    container_name: aegis_frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: aegis_clamav
    profiles: ["media"]
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  capture:
    <<: *app-base
    build:
      context: .
      target: capture
    image: aegis-capture
    container_name: aegis_capture
    command: ["aegis-capture"]
    profiles: ["capture"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
